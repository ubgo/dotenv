# https://taskfile.dev
#
# Tasks for the dotenv library module, at the repo root. The CLI module's
# tasks are included below as `task cli:<task>`.
#
# Every module carries the same task names on purpose: `task test` means the
# same thing everywhere, so moving between modules costs no re-learning.

version: "3"

includes:
  # The CLI module carries its own Taskfile; `task cli:build`, `task cli:ci`,
  # etc. proxy into it with the right working directory.
  cli:
    taskfile: ./cli/Taskfile.yml
    dir: ./cli

vars:
  # Derived from the source so a new Fuzz property is never silently skipped
  # by fuzz:all (a hand-kept list once named 5 of the 8).
  FUZZ_TARGETS:
    sh: grep -ho '^func Fuzz[A-Za-z0-9_]*' *_test.go | sed 's/^func //' | tr '\n' ' '

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Report statement coverage
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | tail -1

  test:cover:html:
    desc: Open the coverage report in a browser
    deps: [test:cover]
    cmds:
      - go tool cover -html=cover.out

  test:uncovered:
    desc: List functions below 100% coverage
    cmds:
      - go test -coverprofile=cover.out ./... > /dev/null
      - 'go tool cover -func=cover.out | grep -v "100.0%" || echo "everything is covered"'

  cover:
    desc: Statement coverage for BOTH modules — the numbers the README badge quotes
    cmds:
      - echo "── library"
      - task: test:cover
      - echo "── cli"
      - task: cli:test:cover

  fuzz:
    desc: 'Fuzz one property: task fuzz -- FuzzParseRender [30s]'
    vars:
      TARGET: '{{index (splitArgs .CLI_ARGS) 0}}'
      DURATION: '{{if gt (len (splitArgs .CLI_ARGS)) 1}}{{index (splitArgs .CLI_ARGS) 1}}{{else}}30s{{end}}'
    cmds:
      # -run "^$" so only the fuzz engine runs; without it the whole unit suite
      # executes first and the fuzz budget is spent on startup.
      - go test -run "^$" -fuzz "^{{.TARGET}}$" -fuzztime {{.DURATION}} .

  fuzz:all:
    desc: Fuzz every property for 30s each
    cmds:
      - for: { var: FUZZ_TARGETS }
        cmd: |
          echo "── {{.ITEM}}"
          go test -run "^$" -fuzz "^{{.ITEM}}$" -fuzztime 30s .

  fuzz:list:
    desc: List the fuzz properties in this module
    cmds:
      - 'grep -h "^func Fuzz" *_test.go | sed "s/func \\(Fuzz[A-Za-z]*\\).*/  \\1/"'

  bench:
    desc: Run benchmarks with allocation counts
    cmds:
      - go test -run "^$" -bench . -benchmem .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (and staticcheck) when installed
    cmds:
      # Look in PATH first, then GOPATH/bin — `go install` puts binaries there
      # but shells often omit it from PATH, which made this task silently skip
      # a linter that was actually installed. if/else, not `&& … ||`: with
      # `||` a linter that FOUND issues fell through to the skip message and
      # the task exited 0.
      - |
        bin=$(command -v golangci-lint || echo "$(go env GOPATH)/bin/golangci-lint")
        if [ -x "$bin" ]; then "$bin" run ./...; else echo "golangci-lint not installed; skipping"; fi
      - |
        bin=$(command -v staticcheck || echo "$(go env GOPATH)/bin/staticcheck")
        if [ -x "$bin" ]; then "$bin" ./...; else echo "staticcheck not installed; skipping"; fi

  fmt:
    desc: Format the source
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail when the source is unformatted
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  doc:
    desc: Print the package's exported API
    cmds:
      - go doc -all .

  deps:
    desc: Show this module's third-party dependencies
    cmds:
      - 'go list -deps ./... | grep "\." | grep -v ubgo/dotenv | sort -u || echo "none — stdlib only"'

  ci:
    desc: The full gate — library AND cli — format, vet, race tests
    cmds:
      - task: fmt:check
      - task: vet
      - task: test:race
      - task: cli:ci

  docs:check:
    desc: 'Docs gate: script self-tests, links, snippet sync, hard wraps, local paths/words, and every Example in both modules'
    cmds:
      # Every check runs even when an earlier one fails, so one run lists all
      # problems; the task still exits 1 if any check failed.
      - |
        fail=0
        run() { echo "── $*"; "$@" || { fail=1; echo "!! FAILED: $*"; }; }
        run python3 -I -B -m unittest discover -s scripts/docs
        run python3 -I -B scripts/docs/linkcheck.py
        run python3 -I -B scripts/docs/snippets.py
        run python3 -I -B scripts/docs/wrapcheck.py
        run python3 -I -B scripts/docs/words.py
        run go test -run Example .
        run sh -c 'cd cli && go test -run Example ./...'
        exit $fail

  docs:sync:
    desc: 'docsync: fail when code a doc sentence cites (a ds:block link) changed since the sentence was last acked'
    cmds:
      # Checks against the committed .ds/ state and never rewrites it. Needs
      # `ds` (go install github.com/ubgo/docsync/cli/cmd/ds@latest);
      # DS_UPDATE=off keeps it from self-updating mid-gate.
      - DS_UPDATE=off ds check

  docs:snippets:fix:
    desc: Rewrite every synced ```go block in the docs from its // snippet:start region, then re-check
    cmds:
      - python3 -I -B scripts/docs/snippets.py --fix

  clean:
    desc: Remove coverage artifacts
    cmds:
      - rm -f cover.out cover.html
