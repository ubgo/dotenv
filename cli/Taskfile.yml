# https://taskfile.dev
#
# Tasks for the dotenvctl CLI module. Run from this directory, or from the
# repo root as `task cli:<task>` — the root Taskfile includes this file.
#
# Same task names as every module on purpose: `task test` means the same
# thing everywhere, so moving between modules costs no re-learning.

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the dotenvctl binary into bin/
    cmds:
      - go build -o bin/dotenvctl ./cmd/dotenvctl

  bump:
    desc: Re-pin the library to the pushed main HEAD — run after any library change, then commit go.mod/go.sum
    cmds:
      # GOWORK=off so the pin resolves against the REMOTE main, not the
      # sibling directory — this pin is what `go install …@main` users build
      # against, and the workspace would mask a stale one. The library commit
      # must be pushed first; a local-only commit cannot become a
      # pseudo-version.
      - GOWORK=off go get github.com/ubgo/dotenv@main
      - GOWORK=off go build ./...
      - 'grep "github.com/ubgo/dotenv v" go.mod'

  install:
    desc: Install dotenvctl into GOPATH/bin
    cmds:
      - go install ./cmd/dotenvctl

  run:
    desc: 'Build and run: task run -- list --json'
    deps: [build]
    cmds:
      - ./bin/dotenvctl {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Report statement coverage
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | tail -1

  test:cover:html:
    desc: Open the coverage report in a browser
    deps: [test:cover]
    cmds:
      - go tool cover -html=cover.out

  test:uncovered:
    desc: List functions below 100% coverage
    cmds:
      - go test -coverprofile=cover.out ./... > /dev/null
      - 'go tool cover -func=cover.out | grep -v "100.0%" || echo "everything is covered"'

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format the source
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail when the source is unformatted
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

  lint:
    desc: Run golangci-lint (and staticcheck) when installed
    cmds:
      # PATH first, then GOPATH/bin — `go install` puts binaries there but
      # shells often omit it, which silently skips an installed linter.
      - |
        bin=$(command -v golangci-lint || echo "$(go env GOPATH)/bin/golangci-lint")
        [ -x "$bin" ] && "$bin" run ./... || echo "golangci-lint not installed; skipping"
      - |
        bin=$(command -v staticcheck || echo "$(go env GOPATH)/bin/staticcheck")
        [ -x "$bin" ] && "$bin" ./... || echo "staticcheck not installed; skipping"

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  ci:
    desc: The full gate for this module — format, vet, race tests
    cmds:
      - task: fmt:check
      - task: vet
      - task: test:race

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
