spec = "1.0"
prefix = "ds"

[scan]
code = ["*.go", "cli/**/*.go"]
docs = ["README.md", "cli/README.md", "docs/**/*.md", "llms.txt"]
exclude = ["**/*_test.go", ".lore/**", "docsi/**", "**/testdata/**", "**/node_modules/**", "**/vendor/**", "dist/**", "public/**"]
generated = ["**/*.pb.go", "**/gen/**", "**/*_gen.go", "**/*_gen.ts"]

[include]
mode = "build"
max_lines = 40

[check]
fuzzy_threshold = 0.8
unacked = "error"

[env]
default = ""

[owners]
"@maintainers" = ["khanakia"]
